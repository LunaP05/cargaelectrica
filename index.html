<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Animación Puesta a Tierra</title>
<style>
  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .scene-container {
    display: flex;
    gap: 50px;
    background: transparent;
    padding: 20px;
  }

  .panel {
    position: relative;
    width: 340px;
    height: 380px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px;
  }

  .panel h3 {
    margin: 5px 0 15px 0;
    font-size: 15px;
    text-align: center;
  }
  .panel.danger h3 { color: #d9534f; }
  .panel.safe h3 { color: #5cb85c; }

  /* Dibujo esquemático de la lavadora y la persona */
  .illustration {
    position: relative;
    width: 280px;
    height: 240px;
  }

  /* Silueta de la lavadora */
  .washer {
    position: absolute;
    bottom: 10px;
    left: 70px;
    width: 100px;
    height: 140px;
    border: 3px solid #333;
    border-radius: 6px;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .washer-drum {
    width: 50px;
    height: 50px;
    border: 2px solid #666;
    border-radius: 50%;
    background: #3498db;
  }

  /* Silueta simplificada de la persona */
  .person {
    position: absolute;
    bottom: 10px;
    right: 30px;
    width: 40px;
    height: 160px;
  }
  .head {
    width: 30px;
    height: 30px;
    border: 3px solid #333;
    border-radius: 50%;
    position: absolute;
    top: 0;
    left: 5px;
    background: #fff;
  }
  .body-shape {
    width: 26px;
    height: 90px;
    background: #333;
    position: absolute;
    top: 35px;
    left: 7px;
    border-radius: 4px;
  }

  /* Chispa de fallo eléctrico */
  .spark {
    position: absolute;
    bottom: 40px;
    left: 155px;
    width: 25px;
    height: 25px;
    background: #f39c12;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: flash 0.6s infinite alternate;
  }

  @keyframes flash {
    from { transform: scale(0.8); opacity: 0.5; }
    to { transform: scale(1.2); opacity: 1; }
  }

  /* Rayo de corriente atravesando a la persona (Peligro) */
  .current-shock {
    position: absolute;
    bottom: 20px;
    right: 45px;
    width: 10px;
    height: 120px;
    background: repeating-linear-gradient(0deg, #ff0000, #ff0000 8px, transparent 8px, transparent 16px);
    animation: flowDown 0.5s linear infinite;
  }

  @keyframes flowDown {
    from { background-position: 0 0; }
    to { background-position: 0 16px; }
  }

  /* Cable de Puesta a Tierra (Seguro) */
  .ground-wire {
    position: absolute;
    bottom: 25px;
    left: 110px;
    width: 50px;
    height: 15px;
    border-bottom: 4px solid #27ae60;
    border-left: 4px solid #27ae60;
  }

  .status-text {
    font-size: 11px;
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
  }
  .panel.danger .status-text { color: #d9534f; }
  .panel.safe .status-text { color: #5cb85c; }
</style>
</head>
<body>

<div class="scene-container">
    <!-- Escenario A: Sin Puesta a Tierra -->
    <div class="panel danger">
      <h3>Sin Puesta a Tierra</h3>
      <div class="illustration">
        <div class="washer"><div class="washer-drum"></div></div>
        <div class="person">
          <div class="head"></div>
          <div class="body-shape"></div>
        </div>
        <div class="spark"></div>
        <div class="current-shock"></div>
      </div>
      <div class="status-text">¡PELIGRO! La corriente atraviesa el cuerpo hacia la tierra.</div>
    </div>

    <!-- Escenario B: Con Puesta a Tierra -->
    <div class="panel safe">
      <h3>Con Puesta a Tierra</h3>
      <div class="illustration">
        <div class="washer"><div class="washer-drum"></div></div>
        <div class="person">
          <div class="head"></div>
          <div class="body-shape"></div>
        </div>
        <div class="spark"></div>
        <div class="ground-wire"></div>
      </div>
      <div class="status-text">¡SEGURO! La corriente se desvía de forma inocua por el cable verde.</div>
    </div>
</div>

</body>
</html>

</div>

</body>
</html>
